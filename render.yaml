services:
  - type: web
    name: medivision-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "1"
    disk:
      name: model-cache
      mountPath: /opt/render/project/src/.cache
      sizeGB: 10
